[project]
name = "b5-the-adversarial-buyer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"beautifulsoup4>=4.12.0",
	"fastapi>=0.115.0",
	"pydantic-settings>=2.6.0",
	"sqlalchemy>=2.0.0",
	"uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
	"httpx>=0.27.0",
	"pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
b5-the-adversarial-buyer = "b5_the_adversarial_buyer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
